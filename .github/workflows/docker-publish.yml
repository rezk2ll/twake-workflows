name: Docker publish

on:
  workflow_call:
    inputs:
      image:
        description: Image name with its registry, like ghcr.io/linagora/my-app or docker.io/linagora/my-app
        type: string
        required: true
      tags:
        description: docker/metadata-action tag rules
        type: string
        default: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=ref,event=tag
      context:
        description: Build context
        type: string
        default: '.'
      file:
        description: Dockerfile path, context/Dockerfile when empty
        type: string
        default: ''
      platforms:
        description: Comma separated target platforms
        type: string
        default: linux/amd64
      push:
        description: Push the image, set to false to only build it
        type: boolean
        default: true
    secrets:
      REGISTRY_USERNAME:
        description: Defaults to the workflow actor, enough for ghcr.io
      REGISTRY_PASSWORD:
        description: Defaults to GITHUB_TOKEN, enough for ghcr.io
      BUILD_SECRETS:
        description: Build secrets, one id=value per line

jobs:
  publish:
    name: Docker publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # github.workflow is the caller's name here; the suffix keeps this group distinct from a caller's own group
    concurrency:
      group: ${{ github.workflow }}-docker-publish-${{ inputs.image }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.image }}
          tags: ${{ inputs.tags }}
      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Read registry
        id: registry
        run: echo "host=${IMAGE%%/*}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ inputs.image }}
      - name: Log in to the registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || github.token }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: ${{ secrets.BUILD_SECRETS }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
